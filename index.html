<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjamin Ruby — Independent Researcher &amp; Commercial Operations</title>
  <meta
    name="description"
    content="Benjamin Ruby is an independent researcher in computational cognitive science, philosophy of mind, and analytic epistemology, and a commercial operations manager in Columbus, Ohio."
  />
  <link rel="canonical" href="https://benjaminruby.com/" />
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #18202a;
      --muted: #4b5868;
      --border: #dfe5ec;
      --accent: #1f4e78;
      --accent-hover: #163a5a;
      --accent-soft: #eef4fa;
      --radius: 12px;
      --max-w: 880px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 0 0 8px 0;
      font-weight: 600;
      z-index: 100;
    }

    .skip-link:focus {
      left: 12px;
    }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    header.hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 22%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      background: var(--accent-soft);
    }

    .eyebrow {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.2;
    }
